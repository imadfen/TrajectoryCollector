[General]
cmdenv-express-mode = false
cmdenv-autoflush = true
record-eventlog = false
**.scalar-recording = false
**.vector-recording = false

# 1. Network & Paths
network = org.car2x.veins.nodes.Scenario
ned-path = src;../veins/src/veins
sim-time-limit = 72000s

# 2. SUMO Manager (Uses your traci.launch.xml wrapper)
*.manager.launchConfig = xmldoc("sumo/traci.launch.xml")
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true

# 3. Playground Size (Must match your SUMO map)
*.playgroundSizeX = 25000m
*.playgroundSizeY = 25000m
*.playgroundSizeZ = 500m
*.connectionManager.gridSize = 500m

##########################################################
#            Standard Veins 5.2 PHY & MAC Settings       #
##########################################################

# Physical Layer (Stops the "Enter parameter" popups)
*.node[*].nic.phy80211p.usePropagationDelay = true
*.node[*].nic.phy80211p.useThermalNoise = true
*.node[*].nic.phy80211p.analogueModels = xmldoc("simulations/config.xml")
*.node[*].nic.phy80211p.decider = xmldoc("simulations/config.xml")
*.node[*].nic.phy80211p.minPowerLevel = -110dBm
*.node[*].nic.phy80211p.sensitivity = -92dBm  # Stress-test v4: realistic high-sensitivity receiver
*.node[*].nic.phy80211p.useNoiseFloor = true
*.node[*].nic.phy80211p.noiseFloor = -98dBm

*.node[*].nic.phy80211p.carrierFrequency = 5.890e9 Hz

# Antenna
*.node[*].nic.phy80211p.antenna = xmldoc("simulations/antenna.xml")

# MAC Layer
*.node[*].nic.mac1609_4.useServiceChannel = false
*.node[*].nic.mac1609_4.txPower = 20mW  # Adjusted for ~500m transmission range
*.node[*].nic.mac1609_4.bitrate = 3Mbps  # Stress-test: half bitrate → channel saturates 2× faster
*.node[*].nic.mac1609_4.queueSize = 1    # Stress-test: drop stale packets immediately (realistic V2X)

# Connection Manager (Manages who can talk to whom)
*.connectionManager.sendDirect = false
*.connectionManager.maxInterfDist = 500m # Capped at 500m range
*.connectionManager.drawMaxIntfDist = false

# Enable NIC debugging
*.node[*].nic.mac1609_4.debug = false
*.node[*].nic.phy80211p.debug = false

##########################################################
#                    Application Setup                   #
##########################################################

# Tell the cars to use YOUR custom C++ code
*.node[*].applType = "trajectories.DataCollectorApp"
# Custom app parameters (optional, but good to have)
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = true
*.node[*].appl.beaconInterval = 0.1s   # Stress-test v2: reverted to 10 Hz per user request

# Static Mode Decision Pipeline
# If the file exists at this path when the simulation starts, every vehicle will
# read its per-timestep beacon_hz and mac_wait_ms from it (Decision Mode).
# If the file is absent, flat beaconing is used as before (Baseline Mode).
# Set to "" to disable decision mode entirely even if the file exists.
*.node[*].appl.decisionsFile = "poc_decisions.json"

##########################################################
#                    Mobility Setup                      #
##########################################################

# This allows Veins to track the cars moving in SUMO
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0